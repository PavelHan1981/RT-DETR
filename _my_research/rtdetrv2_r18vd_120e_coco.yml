__include__: [
  '../rtdetrv2_pytorch/configs/dataset/coco_detection.yml',
  '../rtdetrv2_pytorch/configs/runtime.yml',
  '../rtdetrv2_pytorch/configs/rtdetrv2/include/dataloader.yml',
  '../rtdetrv2_pytorch/configs/rtdetrv2/include/optimizer.yml',
  '../rtdetrv2_pytorch/configs/rtdetrv2/include/rtdetrv2_r50vd.yml',
]


output_dir: ../_my_research/output/rtdetrv2_r18vd_120e_coco_baby


PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


RTDETRTransformerv2:
  num_layers: 3


epoches: 120 

optimizer:
  type: AdamW
  params:
    - 
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.


### pavel added
num_classes: 6

RTDETRTransformerv2:
  num_classes: 6
  num_queries: 100  # from 300 to 100, can significantly improve inference FPS on RK3588

rtdetrv2_loss:
  num_classes: 6

train_dataloader:
  dataset:
    img_folder: D:/Datasets/FaceMask/Coco/train/
    ann_file: D:/Datasets/FaceMask/Coco/train/_annotations.coco.json
    transforms:
      policy:
        epoch: 117
  total_batch_size: 8
  num_workers: 2
  collate_fn:
    scales: ~

val_dataloader:
  dataset:
    img_folder: D:/Datasets/FaceMask/Coco/valid/
    ann_file: D:/Datasets/FaceMask/Coco/valid/_annotations.coco.json
  total_batch_size: 8
  num_workers: 0
